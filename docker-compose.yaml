version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: parking_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: parking_app
    ports:
      - "5432:5432"
    volumes:
      - parking_db_data:/var/lib/postgresql/data
      # Monte le script SQL pour initialiser la DB au premier démarrage
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  parking_db_data: